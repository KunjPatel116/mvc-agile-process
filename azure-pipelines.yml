trigger:
  branches:
    include:
      - main

pool:
  name: Default  # Your self-hosted agent

variables:
  buildConfiguration: 'Release'

stages:
- stage: Build
  jobs:
    - job: BuildJob
      steps:
        - task: UseDotNet@2
          displayName: 'Install .NET SDK'
          inputs:
            packageType: 'sdk'
            version: '8.0.x'

        - task: DotNetCoreCLI@2
          displayName: 'Restore packages'
          inputs:
            command: 'restore'
            projects: '**/*.csproj'

        - task: DotNetCoreCLI@2
          displayName: 'Build solution'
          inputs:
            command: 'build'
            projects: '**/*.csproj'
            arguments: '--configuration $(buildConfiguration)'

        - task: DotNetCoreCLI@2
          displayName: 'Publish app'
          inputs:
            command: 'publish'
            publishWebProjects: true
            arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
            zipAfterPublish: true

        - task: PublishBuildArtifacts@1
          displayName: 'Publish artifact'
          inputs:
            pathToPublish: '$(Build.ArtifactStagingDirectory)'
            artifactName: 'drop'

- stage: Deploy
  dependsOn: Build
  jobs:
    - deployment: DeployToLocal
      environment: 'LocalMachineEnv'
      strategy:
        runOnce:
          deploy:
            steps:
              - download: current

              - task: PowerShell@2
                displayName: 'Unzip published artifact'
                inputs:
                  targetType: 'inline'
                  script: |
                    $zipPath = "$(Pipeline.Workspace)/drop/MvcMovie.zip"
                    $unzipPath = "$(Pipeline.Workspace)/drop/unzipped"
                    if (Test-Path $unzipPath) {
                      Remove-Item $unzipPath -Recurse -Force
                    }
                    Expand-Archive -Path $zipPath -DestinationPath $unzipPath -Force

              - task: PowerShell@2
                displayName: 'Run the ASP.NET Core MVC app (15 sec preview)'
                inputs:
                  targetType: 'inline'
                  script: |
                    Write-Host "Launching app for 15 seconds..."
                    $appPath = "$(Pipeline.Workspace)/drop/unzipped/MvcMovie.dll"
                    $process = Start-Process "dotnet" -ArgumentList $appPath -PassThru -NoNewWindow
                    Start-Sleep -Seconds 15
                    if ($process -and !$process.HasExited) {
                    Write-Host "Stopping app after 15 seconds..."
                    Stop-Process -Id $process.Id -Force
                    } else {
                    Write-Host "App already exited or failed to start."
                    }