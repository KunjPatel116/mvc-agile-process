trigger:
  branches:
    include:
      - main

pool:
  name: Default  # Self-hosted agent

variables:
  buildConfiguration: 'Release'

stages:
- stage: Build
  jobs:
    - job: BuildJob
      steps:
        - task: UseDotNet@2
          inputs:
            packageType: 'sdk'
            version: '8.0.x'

        - task: DotNetCoreCLI@2
          displayName: Restore packages
          inputs:
            command: 'restore'
            projects: '**/*.csproj'

        - task: DotNetCoreCLI@2
          displayName: Build solution
          inputs:
            command: 'build'
            projects: '**/*.csproj'
            arguments: '--configuration $(buildConfiguration)'

        - task: DotNetCoreCLI@2
          displayName: Publish
          inputs:
            command: 'publish'
            publishWebProjects: true
            arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
            zipAfterPublish: true

        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: '$(Build.ArtifactStagingDirectory)'
            artifactName: 'drop'

- stage: Deploy
  dependsOn: Build
  jobs:
    - deployment: DeployToLocal
      environment: 'LocalMachineEnv'
      strategy:
        runOnce:
          deploy:
            steps:
              - download: current
                artifact: drop

              - task: PowerShell@2
                displayName: Run published app
                inputs:
                  targetType: 'inline'
                  script: |
                    Write-Host "Launching the application..."
                    dotnet "$(Pipeline.Workspace)/drop/YourApp.dll"
