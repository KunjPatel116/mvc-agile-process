name: $(Build.BuildId)

resources:
  pipelines:
    - pipeline: mvc_ci  # Internal reference name (can be anything)
      source: 'KunjPatel116.mvc-agile-process'  # Must match EXACTLY
      project: 'MVC Agile Process'  # Add project name
      trigger:
        branches:
          include:
            - main
            - sprint2

stages:
  - stage: Deploy
    jobs:
      - deployment: DeployToIIS
        environment: Production
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none
                
                - download: current
                  artifact: drop
                
                - task: IISWebAppDeploymentOnMachineGroup@0
                  inputs:
                    WebSiteName: 'Default Web Site'
                    VirtualApplication: 'MVCAgileApp'
                    Package: '$(Pipeline.Workspace)/drop/**/*.zip'