name: $(Build.BuildId)

# Trigger when CI pipeline completes
resources:
  pipelines:
    - pipeline: MVC-Movie-CI  # 👈 This must match your CI pipeline name exactly
      source: 'MVC-Movie-CI'   # Your CI pipeline name in quotes
      trigger: 
        enabled: true
        branches:
          include:
            - main  # Trigger when CI completes on main branch

stages:
  - stage: Deploy
    displayName: 'Deploy to Production'
    jobs:
      - deployment: DeployToIIS
        displayName: 'Deploy to IIS'
        environment: 'Production'  # Must match your environment name
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none  # No code needed, we use artifacts
                
                # Download build artifacts from CI pipeline
                - download: current
                  artifact: 'webapp'
                
                # Deploy to IIS
                - task: IISWebAppDeploymentOnMachineGroup@0
                  displayName: 'Deploy MVC Application'
                  inputs:
                    WebSiteName: 'Default Web Site'
                    VirtualApplication: 'MVCAgileApp'
                    Package: '$(Pipeline.Workspace)/webapp/**/*.zip'
                    TakeAppOfflineFlag: true
                    RemoveAdditionalFilesFlag: true