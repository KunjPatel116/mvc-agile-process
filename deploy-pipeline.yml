name: $(Build.BuildId)

resources:
  pipelines:
    - pipeline: mvc_ci
      source: 'KunjPatel116.mvc-agile-process'  # Will match after CI pipeline creation
      trigger:
        branches:
          include:
            - main

stages:
- stage: Deploy
  jobs:
  - deployment: DeployToIIS
    environment: Production
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: none
          
          - download: current
            artifact: 'webapp'
          
          - task: IISWebAppDeploymentOnMachineGroup@0
            inputs:
              WebSiteName: 'Default Web Site'
              VirtualApplication: 'MVCAgileApp'
              Package: '$(Pipeline.Workspace)/webapp/**/*.zip'
              TakeAppOfflineFlag: true