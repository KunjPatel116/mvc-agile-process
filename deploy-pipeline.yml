name: $(Build.BuildId)

resources:
  pipelines:
    - pipeline: mvc_movie_ci  # Internal reference (can be any name)
      source: 'KunjPatel116.mvc-agile-process'  # MUST match exact pipeline name
      trigger: 
        branches:
          include:
            - main  # Trigger when CI completes on main branch

stages:
  - stage: Deploy
    displayName: 'Deploy to Production'
    jobs:
      - deployment: DeployToIIS
        displayName: 'Deploy to IIS'
        environment: 'Production'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none
                
                - download: current
                  artifact: drop  # Default artifact name
                
                - task: IISWebAppDeploymentOnMachineGroup@0
                  displayName: 'Deploy MVC Application'
                  inputs:
                    WebSiteName: 'Default Web Site'
                    VirtualApplication: 'MVCAgileApp'
                    Package: '$(Pipeline.Workspace)/drop/**/*.zip'
                    TakeAppOfflineFlag: true
                    RemoveAdditionalFilesFlag: true