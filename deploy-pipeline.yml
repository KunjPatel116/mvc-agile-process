name: $(Build.BuildId)

resources:
  pipelines:
    - pipeline: mvc_ci
      source: 'KunjPatel116.mvc-agile-process'
      trigger:
        branches:
          include:
            - main

pool:
  vmImage: 'windows-latest'

steps:
- download: current
  artifact: 'webapp'

- script: |
    echo "##[section]Deployment Instructions"
    echo "1. Download artifacts from this build"
    echo "2. Extract contents to C:\inetpub\MVCAgileApp"
    echo "3. Configure IIS with:"
    echo "   - App Pool: No Managed Code"
    echo "   - Virtual App: MVCAgileApp"
    echo "##[warning]Manual deployment required for Microsoft-hosted agents"
  displayName: 'Display Deployment Instructions'

- task: CopyFiles@2
  displayName: 'Prepare Deployment Package'
  inputs:
    SourceFolder: '$(Pipeline.Workspace)/webapp'
    Contents: '**/*'
    TargetFolder: '$(Build.ArtifactStagingDirectory)/package'

- task: PublishBuildArtifacts@1
  displayName: 'Publish Deployment Package'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/package'
    ArtifactName: 'deployment-package'